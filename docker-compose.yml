services:
  # ==========================================
  # Database: MongoDB 7.0
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: ruscholar-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ruscholar
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ruscholar-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend API & Telegram Webhook Server
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruscholar-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/ruscholar
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-http://localhost:8080}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    ports:
      - "5000:5000"
    networks:
      - ruscholar-net

  # ==========================================
  # Frontend: Telegram Mini App (Nginx Web Server)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruscholar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - ruscholar-net

volumes:
  mongo-data:
    driver: local

networks:
  ruscholar-net:
    driver: bridge
