<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06090e"/>
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Academic Cap Gradient -->
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <!-- Open Book Pages Gradient -->
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>

    <!-- Gold Tassel Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#borderGradient)" stroke-width="4"/>

  <!-- Subtle Inner Grid / Tech Dots -->
  <g opacity="0.12" fill="#58a6ff">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="120" cy="80" r="3"/>
    <circle cx="160" cy="80" r="3"/>
    <circle cx="352" cy="80" r="3"/>
    <circle cx="392" cy="80" r="3"/>
    <circle cx="432" cy="80" r="3"/>
    <circle cx="80" cy="432" r="3"/>
    <circle cx="120" cy="432" r="3"/>
    <circle cx="392" cy="432" r="3"/>
    <circle cx="432" cy="432" r="3"/>
  </g>

  <!-- Open Academic Book Base (Pages) -->
  <g id="openBook">
    <!-- Left Page -->
    <path d="M 256,360 C 210,340 140,335 96,350 C 96,255 96,220 96,220 C 140,205 210,210 256,230 Z" 
          fill="url(#bookLeft)" opacity="0.95" filter="url(#glow)"/>
    <path d="M 256,360 C 210,340 140,335 96,350 C 96,255 96,220 96,220 C 140,205 210,210 256,230 Z" 
          fill="url(#bookLeft)"/>
    
    <!-- Left Page Lines -->
    <path d="M 130,245 C 165,235 210,240 236,252" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 130,275 C 165,265 210,270 236,282" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 130,305 C 165,295 210,300 236,312" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Right Page -->
    <path d="M 256,360 C 302,340 372,335 416,350 C 416,255 416,220 416,220 C 372,205 302,210 256,230 Z" 
          fill="url(#bookRight)" opacity="0.95" filter="url(#glow)"/>
    <path d="M 256,360 C 302,340 372,335 416,350 C 416,255 416,220 416,220 C 372,205 302,210 256,230 Z" 
          fill="url(#bookRight)"/>

    <!-- Right Page Lines -->
    <path d="M 276,252 C 302,240 347,235 382,245" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 276,282 C 302,270 347,265 382,275" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 276,312 C 302,300 347,295 382,305" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Book Spine Glow Center -->
    <line x1="256" y1="230" x2="256" y2="368" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Spaced Repetition Neural Nodes & Translation Arc -->
  <g id="srsNodes" opacity="0.85">
    <!-- Connecting Arc -->
    <path d="M 180,185 C 220,150 292,150 332,185" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="6,6"/>
    <!-- Central Translate Symbol / Exchange node -->
    <circle cx="180" cy="185" r="7" fill="#58a6ff" filter="url(#glow)"/>
    <circle cx="332" cy="185" r="7" fill="#bc8cff" filter="url(#glow)"/>
    <circle cx="256" cy="162" r="5" fill="#ffd700"/>
  </g>

  <!-- Academic Graduation Mortarboard Cap -->
  <g id="mortarboard" transform="translate(0, -10)">
    <!-- Cap Skull Base -->
    <path d="M 184,152 L 184,188 C 184,208 328,208 328,188 L 328,152 Z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    
    <!-- Diamond Top Rhombus -->
    <polygon points="256,86 426,142 256,198 86,142" fill="url(#capGradient)" filter="url(#glow)" opacity="0.9"/>
    <polygon points="256,86 426,142 256,198 86,142" fill="url(#capGradient)" stroke="#ffffff" stroke-width="3"/>

    <!-- Cap Button & Gold Tassel -->
    <circle cx="256" cy="142" r="8" fill="#ffd700"/>
    
    <!-- Tassel Ribbon & Fringe -->
    <path d="M 256,142 Q 210,146 178,180 T 166,236" fill="none" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="166" cy="240" r="6" fill="#ffd700"/>
    <rect x="162" y="244" width="8" height="20" rx="3" fill="url(#goldGradient)"/>
  </g>

  <!-- Typography: RuScholar Branding -->
  <g id="brandTypography">
    <text x="256" y="420" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#ffffff">
      RU<tspan fill="#58a6ff">SCHOLAR</tspan>
    </text>
    <text x="256" y="450" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#8b949e">
      ACADEMIC TRANSLATE &amp; SRS
    </text>
  </g>
</svg>
